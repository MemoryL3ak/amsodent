<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Avatar de Damarita">
  <defs>
    <radialGradient id="dmr-bg" cx="50%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#FFFAEE"/>
      <stop offset="50%" stop-color="#FDE7A6"/>
      <stop offset="100%" stop-color="#F4B413"/>
    </radialGradient>
    <radialGradient id="dmr-halo" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dmr-skin" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FDEAD6"/>
      <stop offset="100%" stop-color="#F8CFA6"/>
    </linearGradient>
    <linearGradient id="dmr-hair" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#332B3C"/>
      <stop offset="55%" stop-color="#1E1726"/>
      <stop offset="100%" stop-color="#100B16"/>
    </linearGradient>
    <radialGradient id="dmr-iris" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D8B179"/>
      <stop offset="55%" stop-color="#A8743D"/>
      <stop offset="100%" stop-color="#5C3A1A"/>
    </radialGradient>
    <linearGradient id="dmr-lips" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E27E7B"/>
      <stop offset="100%" stop-color="#C8566A"/>
    </linearGradient>
    <radialGradient id="dmr-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD24D"/>
      <stop offset="100%" stop-color="#F2960A"/>
    </radialGradient>
    <clipPath id="dmr-clip"><circle cx="120" cy="120" r="120"/></clipPath>
    <clipPath id="dmr-eyeL"><ellipse cx="103" cy="115" rx="12" ry="10"/></clipPath>
    <clipPath id="dmr-eyeR"><ellipse cx="137" cy="115" rx="12" ry="10"/></clipPath>
    <filter id="dmr-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <g clip-path="url(#dmr-clip)">
    <rect width="240" height="240" fill="url(#dmr-bg)"/>

    <!-- girasoles decorativos de fondo -->
    <g opacity="0.10" fill="#FFFFFF">
      <g transform="translate(26 214)">
        <g><ellipse cx="0" cy="-15" rx="6" ry="11"/><ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(60)"/><ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(120)"/><ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(180)"/><ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(240)"/><ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(300)"/></g>
        <circle r="8"/>
      </g>
      <g transform="translate(216 30) scale(0.8)">
        <g><ellipse cx="0" cy="-15" rx="6" ry="11"/><ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(60)"/><ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(120)"/><ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(180)"/><ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(240)"/><ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(300)"/></g>
        <circle r="8"/>
      </g>
    </g>
    <g fill="#FFFFFF" opacity="0.7">
      <path d="M204 150 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z"/>
      <path d="M34 96 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 Z"/>
    </g>

    <ellipse cx="120" cy="116" rx="80" ry="86" fill="url(#dmr-halo)"/>

    <!-- HAIR back (largo y ondulado) -->
    <path d="M70 240 C58 188 56 144 64 104 C72 58 96 42 120 42 C144 42 168 58 176 104 C184 144 182 188 170 240 C160 214 158 196 160 178 C150 200 150 222 154 240 L86 240 C90 222 90 200 80 178 C82 196 80 214 70 240 Z" fill="url(#dmr-hair)"/>

    <!-- NECK -->
    <path d="M108 153 L108 184 Q120 192 132 184 L132 153 Q120 163 108 153 Z" fill="#F2C496"/>
    <path d="M108 153 Q120 163 132 153 Q120 169 108 153 Z" fill="#E2A879" opacity="0.4"/>

    <!-- BLOUSE -->
    <path d="M42 240 C46 198 80 182 120 182 C160 182 194 198 198 240 Z" fill="#FBF4E6"/>
    <path d="M120 182 L110 199 L120 205 L130 199 Z" fill="#EFE3CA"/>
    <circle cx="138" cy="206" r="4.5" fill="url(#dmr-sun)"/>
    <circle cx="138" cy="206" r="1.8" fill="#6B3F12"/>

    <!-- HAIR mechones sobre hombros -->
    <path d="M68 240 C60 206 66 188 84 180 C77 200 80 222 88 240 Z" fill="url(#dmr-hair)"/>
    <path d="M172 240 C180 206 174 188 156 180 C163 200 160 222 152 240 Z" fill="url(#dmr-hair)"/>

    <!-- FACE -->
    <path d="M120 64 C93 64 78 87 78 113 C78 142 97 163 120 163 C143 163 162 142 162 113 C162 87 147 64 120 64 Z" fill="url(#dmr-skin)"/>
    <!-- contorno suave -->
    <path d="M158 100 C166 124 156 150 136 160 C154 148 158 122 150 100 Z" fill="#EBB184" opacity="0.30"/>

    <!-- EARS + aritos girasol -->
    <ellipse cx="79" cy="118" rx="6" ry="9.5" fill="#F8CFA6"/>
    <ellipse cx="161" cy="118" rx="6" ry="9.5" fill="#F8CFA6"/>
    <circle cx="79" cy="132" r="3.2" fill="url(#dmr-sun)"/>
    <circle cx="161" cy="132" r="3.2" fill="url(#dmr-sun)"/>

    <!-- BLUSH (suave) -->
    <g filter="url(#dmr-soft)">
      <ellipse cx="95" cy="133" rx="9" ry="5.5" fill="#F4A39A" opacity="0.55"/>
      <ellipse cx="145" cy="133" rx="9" ry="5.5" fill="#F4A39A" opacity="0.55"/>
    </g>

    <!-- EYESHADOW -->
    <g filter="url(#dmr-soft)" opacity="0.30">
      <path d="M91 110 Q103 101 116 109 Q104 106 91 110 Z" fill="#C98EA6"/>
      <path d="M124 109 Q137 101 149 110 Q136 106 124 109 Z" fill="#C98EA6"/>
    </g>

    <!-- BROWS -->
    <path d="M90 100 Q103 92 117 98 L116 100 Q104 96 92 102 Z" fill="#2A2030"/>
    <path d="M123 98 Q137 92 150 100 L148 102 Q136 96 124 100 Z" fill="#2A2030"/>

    <!-- EYES grandes y expresivos -->
    <g>
      <ellipse cx="103" cy="115" rx="12" ry="10" fill="#FFFFFF"/>
      <ellipse cx="137" cy="115" rx="12" ry="10" fill="#FFFFFF"/>
      <g clip-path="url(#dmr-eyeL)">
        <circle cx="104" cy="113" r="8.8" fill="url(#dmr-iris)"/>
        <circle cx="104" cy="113" r="8.8" fill="none" stroke="#4A2E14" stroke-width="1.2"/>
        <circle cx="104" cy="113" r="3.8" fill="#2A1A0E"/>
        <circle cx="100.6" cy="109.6" r="3" fill="#FFFFFF"/>
        <circle cx="107.5" cy="117" r="1.6" fill="#FFFFFF" opacity="0.85"/>
        <path d="M97 119 Q104 123 111 119 Q104 121 97 119 Z" fill="#D8B179" opacity="0.7"/>
      </g>
      <g clip-path="url(#dmr-eyeR)">
        <circle cx="136" cy="113" r="8.8" fill="url(#dmr-iris)"/>
        <circle cx="136" cy="113" r="8.8" fill="none" stroke="#4A2E14" stroke-width="1.2"/>
        <circle cx="136" cy="113" r="3.8" fill="#2A1A0E"/>
        <circle cx="132.6" cy="109.6" r="3" fill="#FFFFFF"/>
        <circle cx="139.5" cy="117" r="1.6" fill="#FFFFFF" opacity="0.85"/>
        <path d="M129 119 Q136 123 143 119 Q136 121 129 119 Z" fill="#D8B179" opacity="0.7"/>
      </g>
      <!-- doble párpado -->
      <path d="M94 108 Q103 104 113 108" fill="none" stroke="#E0A98A" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
      <path d="M127 108 Q137 104 146 108" fill="none" stroke="#E0A98A" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
      <!-- línea de pestañas superior + flick -->
      <path d="M90 113 Q103 103 116 111" fill="none" stroke="#171019" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M116 111 Q120 109 124 105" fill="none" stroke="#171019" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M124 113 Q137 103 150 111" fill="none" stroke="#171019" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M124 111 Q120 109 116 105" fill="none" stroke="#171019" stroke-width="2.6" stroke-linecap="round"/>
      <!-- pestañas -->
      <path d="M91 112 l-3 -2 M95 108 l-2 -3 M99 106 l-1 -3" stroke="#171019" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M149 112 l3 -2 M145 108 l2 -3 M141 106 l1 -3" stroke="#171019" stroke-width="1.5" stroke-linecap="round"/>
      <!-- pestañas inferiores -->
      <path d="M96 122 Q103 126 110 121" fill="none" stroke="#5A3D26" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
      <path d="M130 121 Q137 126 144 122" fill="none" stroke="#5A3D26" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
    </g>

    <!-- NOSE -->
    <path d="M120 121 q-2.5 5.5 1.8 7" fill="none" stroke="#E3A878" stroke-width="2" stroke-linecap="round"/>

    <!-- LIPS glossy -->
    <path d="M110 137 Q115 134 120 136 Q125 134 130 137 Q126 149 120 150 Q114 149 110 137 Z" fill="url(#dmr-lips)"/>
    <path d="M120 136 L117 139 L123 139 Z" fill="#EE9591" opacity="0.7"/>
    <path d="M114 145 Q120 148 126 145 Q120 147 114 145 Z" fill="#FFFFFF" opacity="0.55"/>

    <!-- GLASSES rosé finos -->
    <g fill="none" stroke="#D98C5F" stroke-width="2.4">
      <path d="M86 112 Q86 102 99 102 Q120 102 120 110 Q120 122 104 124 Q88 124 86 112 Z" fill="#FFFFFF" fill-opacity="0.07"/>
      <path d="M154 112 Q154 102 141 102 Q120 102 120 110 Q120 122 136 124 Q152 124 154 112 Z" fill="#FFFFFF" fill-opacity="0.07"/>
      <path d="M118 108 Q120 105 122 108"/>
      <path d="M86 110 L70 106"/>
      <path d="M154 110 L170 106"/>
    </g>

    <!-- HAIR front (fleco con raya al costado, elegante) -->
    <path d="M120 52 C90 52 72 74 70 116 C76 96 88 86 104 86 C98 78 104 64 120 60 C112 70 116 80 124 84 C112 70 120 56 120 52 Z" fill="url(#dmr-hair)"/>
    <path d="M120 52 C150 52 168 74 170 116 C164 94 150 84 130 86 C140 76 132 62 120 56 C128 64 124 76 120 60 C128 56 120 54 120 52 Z" fill="url(#dmr-hair)"/>

    <!-- mechones que enmarcan -->
    <path d="M70 114 C64 154 70 190 84 212 C78 188 76 152 80 118 Z" fill="url(#dmr-hair)"/>
    <path d="M170 114 C176 154 170 190 156 212 C162 188 164 152 160 118 Z" fill="url(#dmr-hair)"/>

    <!-- brillo del pelo -->
    <path d="M150 64 Q162 86 160 116" fill="none" stroke="#574C63" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M92 66 Q82 88 84 116" fill="none" stroke="#574C63" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M120 56 Q108 64 104 80" fill="none" stroke="#4A4056" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- GIRASOL accesorio (en el pelo, lado izquierdo) -->
    <g transform="translate(84 66)">
      <g fill="url(#dmr-sun)">
        <ellipse cx="0" cy="-13" rx="5" ry="9"/>
        <ellipse cx="0" cy="-13" rx="5" ry="9" transform="rotate(40)"/>
        <ellipse cx="0" cy="-13" rx="5" ry="9" transform="rotate(80)"/>
        <ellipse cx="0" cy="-13" rx="5" ry="9" transform="rotate(120)"/>
        <ellipse cx="0" cy="-13" rx="5" ry="9" transform="rotate(160)"/>
        <ellipse cx="0" cy="-13" rx="5" ry="9" transform="rotate(200)"/>
        <ellipse cx="0" cy="-13" rx="5" ry="9" transform="rotate(240)"/>
        <ellipse cx="0" cy="-13" rx="5" ry="9" transform="rotate(280)"/>
        <ellipse cx="0" cy="-13" rx="5" ry="9" transform="rotate(320)"/>
      </g>
      <circle r="6.2" fill="#5E3410"/>
      <circle r="6.2" fill="none" stroke="#7A4A1C" stroke-width="1.2"/>
    </g>

    <!-- destellos -->
    <g fill="#FFFFFF">
      <path d="M150 150 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5 Z" opacity="0.85"/>
      <circle cx="64" cy="150" r="1.6" opacity="0.7"/>
    </g>
  </g>

  <circle cx="120" cy="120" r="118" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6"/>
</svg>
